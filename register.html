<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - My Tasks</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container auth-container">

        <div class="auth-header">

            <div class="auth-logo">✓</div>

            <h1>Create Account</h1>

            <p>Register to start managing your tasks</p>

        </div>


        <form id="registerForm">

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    autocomplete="name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button
                type="submit"
                id="registerButton"
            >
                Create Account
            </button>

        </form>


        <p id="message"></p>


        <p class="auth-switch">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>


    <script src="register.js"></script>

</body>

</html>
